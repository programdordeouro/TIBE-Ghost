<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIBE Ghost</title>
<style>
  :root {
    --bg:      #080808;
    --bg2:     #111;
    --bg3:     #181818;
    --border:  #242424;
    --cyan:    #00d4ff;
    --cyan2:   #0099bb;
    --white:   #e8e8e8;
    --dim:     #555;
    --green:   #00e87a;
    --yellow:  #ffc340;
    --red:     #ff4d4d;
    --magenta: #d966ff;
    --blue:    #4d9aff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--white);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; background: var(--bg2);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { font-weight: 800; font-size: 15px; letter-spacing: 3px; color: var(--cyan); white-space: nowrap; }
  .session-info { font-size: 12px; color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-info span { color: var(--white); }
  .action-bar {
    display: flex; gap: 5px; padding: 7px 18px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .action-btn {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--white); padding: 4px 11px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: inherit;
    transition: border-color .15s, color .15s; white-space: nowrap;
  }
  .action-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .action-btn:disabled { opacity: .4; cursor: not-allowed; }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px 18px;
    display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .msg { display: flex; gap: 10px; max-width: 800px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ghost { align-self: flex-start; }
  .msg.system { align-self: stretch; max-width: 100%; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  }
  .msg.user  .msg-avatar { background: var(--cyan2); color: #000; }
  .msg.ghost .msg-avatar { background: var(--bg3); color: var(--cyan); border: 1px solid var(--border); }
  .msg-body { display: flex; flex-direction: column; gap: 3px; }
  .msg-label { font-size: 11px; color: var(--dim); }
  .msg.user .msg-label { text-align: right; }
  .msg-bubble { padding: 10px 14px; border-radius: 10px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user  .msg-bubble { background: #0e2a33; border: 1px solid var(--cyan2); }
  .msg.ghost .msg-bubble { background: var(--bg3); border: 1px solid var(--border); }
  .result-card { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .result-card .card-header { padding: 8px 14px; font-size: 12px; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .result-card .card-body { padding: 14px; }
  .card-green   .card-header { background: #0a1f12; color: var(--green);   border-bottom: 1px solid #0d3020; }
  .card-yellow  .card-header { background: #1f1800; color: var(--yellow);  border-bottom: 1px solid #2e2100; }
  .card-blue    .card-header { background: #0a1020; color: var(--blue);    border-bottom: 1px solid #0d1f35; }
  .card-magenta .card-header { background: #1a0a20; color: var(--magenta); border-bottom: 1px solid #2a0f30; }
  .card-red     .card-header { background: #200a0a; color: var(--red);     border-bottom: 1px solid #350d0d; }
  .card-cyan    .card-header { background: #041820; color: var(--cyan);    border-bottom: 1px solid #0a2a35; }
  .card-white   .card-header { background: var(--bg3); color: var(--white); border-bottom: 1px solid var(--border); }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .grid-6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .opp-item { padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .opp-item .opp-title { color: var(--green); font-weight: 600; margin-bottom: 5px; }
  .opp-item .opp-score { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .opp-item .opp-action { margin-top: 6px; font-size: 12px; color: var(--cyan); }
  .specialist-item { padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .specialist-name { font-weight: 600; font-size: 12px; margin-bottom: 6px; }
  .synthesis-box { margin-top: 10px; padding: 12px; border: 1px solid #2a0f30; border-radius: 8px; background: #0e0514; }
  .synthesis-box .synth-label { color: var(--magenta); font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .causal-box { margin-top: 10px; padding: 12px; border: 1px solid #0d1f35; border-radius: 8px; background: #040e1a; }
  .causal-box .causal-label { color: var(--blue); font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .briefing-box { padding: 12px 14px; background: #0a0f20; border: 1px solid #1a2a40; border-radius: 10px; line-height: 1.6; }
  .briefing-box .brief-label { color: var(--blue); font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .emotion-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
  .emotion-animado    { background: #0a2010; color: var(--green); }
  .emotion-cansado    { background: #1a1a0a; color: var(--yellow); }
  .emotion-estressado { background: #200a0a; color: var(--red); }
  .emotion-duvida     { background: #0a0a20; color: var(--blue); }
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .typing span { width: 6px; height: 6px; background: var(--dim); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .input-area {
    display: flex; gap: 8px; padding: 12px 18px;
    background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0;
  }
  #input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--white); padding: 9px 13px;
    font-size: 14px; font-family: inherit; resize: none; outline: none;
    line-height: 1.4; max-height: 120px; transition: border-color .15s;
  }
  #input:focus { border-color: var(--cyan); }
  #input::placeholder { color: var(--dim); }
  #send { background: var(--cyan); border: none; color: #000; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; font-family: inherit; transition: opacity .15s; }
  #send:hover { opacity: .85; }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; max-height: 85dvh; overflow-y: auto; }
  .modal h2 { color: var(--cyan); font-size: 16px; margin-bottom: 18px; }
  .field-group { margin-bottom: 14px; }
  .field-group label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .field-group input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--white); padding: 8px 11px; font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; }
  .field-group input:focus { border-color: var(--cyan); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn-primary   { background: var(--cyan); border: none; color: #000; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: inherit; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--white); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .topic-modal { max-width: 380px; }
  .topic-modal h3 { color: var(--cyan); margin-bottom: 12px; }
  .topic-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--white); padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
  .topic-input:focus { border-color: var(--cyan); }
  #setup-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .setup-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; }
  .setup-card h2 { color: var(--cyan); font-size: 18px; margin-bottom: 6px; }
  .setup-card p  { color: var(--dim); font-size: 13px; margin-bottom: 22px; }
  .step-label { font-size: 11px; color: var(--dim); margin-bottom: 16px; }
  .step-question { font-size: 15px; color: var(--white); margin-bottom: 14px; }
  .step-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--white); padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 14px; transition: border-color .15s; }
  .step-input:focus { border-color: var(--cyan); }
  .step-actions { display: flex; justify-content: flex-end; }
  .progress-dots { display: flex; gap: 5px; margin-bottom: 20px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .dot.active { background: var(--cyan); }
  .dot.done   { background: var(--cyan2); }
  #main-chat { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  @media (max-width: 500px) {
    .action-bar { gap: 4px; padding: 6px 12px; }
    .action-btn { padding: 3px 8px; font-size: 11px; }
    #messages { padding: 14px 12px; }
    .input-area { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div id="setup-screen" style="display:none">
  <div class="setup-card">
    <h2>TIBE Ghost</h2>
    <p>Configure sua presença digital antes de começar.</p>
    <div class="progress-dots" id="dots"></div>
    <div id="setup-steps"></div>
  </div>
</div>

<div id="main-chat" style="display:none">
  <header>
    <div class="logo">TIBE GHOST</div>
    <div class="session-info" id="session-info">carregando...</div>
    <button class="action-btn" onclick="openProfile()">⚙ Perfil</button>
  </header>
  <div class="action-bar">
    <button class="action-btn" onclick="runRadar()"              id="btn-radar">🔭 Radar</button>
    <button class="action-btn" onclick="promptTopic('simulate')" id="btn-simulate">📊 Simular</button>
    <button class="action-btn" onclick="promptTopic('council')"  id="btn-council">🧠 Conselho</button>
    <button class="action-btn" onclick="loadPatterns()"          id="btn-patterns">🔍 Padrões</button>
    <button class="action-btn" onclick="loadContradictions()"    id="btn-contradictions">⚡ Contradições</button>
    <button class="action-btn" onclick="loadHistory()"           id="btn-history">📜 Histórico</button>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <textarea id="input" placeholder="Digite sua mensagem... (Enter para enviar)" rows="1"></textarea>
    <button id="send" onclick="sendMessage()">Enviar</button>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-profile">
  <div class="modal">
    <h2>⚙ Perfil</h2>
    <div class="field-group"><label>Nome do Ghost</label><input id="pf-ghost_name"></div>
    <div class="field-group"><label>Seu nome</label><input id="pf-user_name"></div>
    <div class="field-group"><label>Objetivo principal (2 anos)</label><input id="pf-main_goal"></div>
    <div class="field-group"><label>Projetos ativos</label><input id="pf-projects"></div>
    <div class="field-group"><label>Habilidades principais</label><input id="pf-skills"></div>
    <div class="field-group"><label>Maior medo</label><input id="pf-biggest_fear"></div>
    <div class="field-group"><label>O que não funcionou</label><input id="pf-past_failures"></div>
    <div class="field-group"><label>Quem quer ser em 5 anos</label><input id="pf-future_self"></div>
    <div class="field-group"><label>Mercado / nicho</label><input id="pf-market"></div>
    <div class="field-group"><label>País / Cidade</label><input id="pf-location"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeProfile()">Cancelar</button>
      <button class="btn-primary"   onclick="saveProfile()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-topic">
  <div class="modal topic-modal">
    <h3 id="topic-title">Tema</h3>
    <input class="topic-input" id="topic-input" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeTopic()">Cancelar</button>
      <button class="btn-primary"   onclick="confirmTopic()">Confirmar</button>
    </div>
  </div>
</div>

<script>
const BASE = '';
let sessionId = localStorage.getItem('tibe_session') || crypto.randomUUID();
localStorage.setItem('tibe_session', sessionId);
let topicAction = null;
let profile = {};

const SETUP_STEPS = [
  { key: 'ghost_name',    question: 'Como você quer que seu Ghost se chame?' },
  { key: 'user_name',     question: 'Qual é o seu nome?' },
  { key: 'location',      question: 'Cidade e país onde você está?' },
  { key: 'main_goal',     question: 'Em uma frase: qual é o maior objetivo da sua vida nos próximos 2 anos?' },
  { key: 'projects',      question: 'Quais projetos você está trabalhando agora? (separe por vírgula)' },
  { key: 'skills',        question: 'Quais são suas 3 principais habilidades?' },
  { key: 'biggest_fear',  question: 'Qual é o seu maior medo em relação aos seus objetivos?' },
  { key: 'past_failures', question: 'O que você já tentou que não funcionou?' },
  { key: 'future_self',   question: 'Descreva quem você quer ser daqui a 5 anos com detalhes.' },
  { key: 'market',        question: 'Em qual nicho ou mercado você quer ter impacto?' },
];
let setupStep = 0;

async function init() {
  const res = await fetch(`${BASE}/api/profile`);
  profile = await res.json();
  if (profile.ghost_name && profile.user_name && profile.main_goal) showMain();
  else showSetup();
}

function showSetup() {
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('main-chat').style.display = 'none';
  renderDots(); renderStep();
}

function renderDots() {
  document.getElementById('dots').innerHTML = SETUP_STEPS.map((_, i) =>
    `<div class="dot ${i < setupStep ? 'done' : i === setupStep ? 'active' : ''}"></div>`
  ).join('');
}

function renderStep() {
  const step = SETUP_STEPS[setupStep];
  document.getElementById('setup-steps').innerHTML = `
    <div class="step-label">Passo ${setupStep + 1} de ${SETUP_STEPS.length}</div>
    <div class="step-question">${step.question}</div>
    <input class="step-input" id="step-input" placeholder="Sua resposta..." />
    <div class="step-actions">
      <button class="btn-primary" onclick="nextStep()">
        ${setupStep < SETUP_STEPS.length - 1 ? 'Próximo →' : 'Concluir ✓'}
      </button>
    </div>`;
  const inp = document.getElementById('step-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') nextStep(); });
}

async function nextStep() {
  const val = document.getElementById('step-input').value.trim();
  if (!val) return;
  await fetch(`${BASE}/api/profile`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ key: SETUP_STEPS[setupStep].key, value: val }),
  });
  setupStep++;
  if (setupStep >= SETUP_STEPS.length) {
    profile = await (await fetch(`${BASE}/api/profile`)).json();
    fetch(`${BASE}/api/profile/analyze`, { method: 'POST' }).catch(() => {});
    showMain();
  } else { renderDots(); renderStep(); }
}

async function showMain() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('main-chat').style.display = 'flex';
  const sessRes = await fetch(`${BASE}/api/sessions`);
  const sessData = await sessRes.json();
  const now = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  document.getElementById('session-info').innerHTML =
    `Ghost: <span>${profile.ghost_name || 'Ghost'}</span> &nbsp;|&nbsp; Sessão #<span>${(sessData.count||0)+1}</span> &nbsp;|&nbsp; ${now}`;
  document.title = `${profile.ghost_name || 'Ghost'} · TIBE Ghost`;
  const bData = await (await fetch(`${BASE}/api/briefing`)).json();
  if (bData.briefing) addBriefing(bData.briefing);
}

function addMessage(role, text, emotion) {
  const container = document.getElementById('messages');
  const label = role === 'user' ? 'Você' : (profile.ghost_name || 'Ghost');
  const avatar = role === 'user' ? 'Vc' : '👻';
  const emotionTag = emotion && emotion !== 'neutro'
    ? `<span class="emotion-tag emotion-${emotion}">${emotion}</span>` : '';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-label">${label}${emotionTag}</div>
      <div class="msg-bubble">${escHtml(text)}</div>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addBriefing(text) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="briefing-box"><div class="brief-label">💭 ENQUANTO VOCÊ ESTAVA FORA</div>${escHtml(text)}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addTyping() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ghost'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">👻</div><div class="msg-body"><div class="msg-label">${profile.ghost_name||'Ghost'}</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

function addSystemCard(html) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg system'; div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  setLoading(true);
  addMessage('user', text);
  addTyping();
  try {
    const res = await fetch(`${BASE}/api/chat`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    removeTyping();
    addMessage('ghost', data.reply, data.emotion);
  } catch (e) {
    removeTyping();
    addMessage('ghost', '⚠ Erro ao conectar. Verifique a API key.');
  } finally { setLoading(false); }
}

async function runRadar() {
  setLoading(true, 'btn-radar');
  addSystemCard(`<div class="result-card card-green"><div class="card-header">🔭 RADAR — buscando oportunidades...</div><div class="card-body"><div class="typing"><span></span><span></span><span></span></div></div></div>`);
  try {
    const res = await fetch(`${BASE}/api/radar`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    document.getElementById('messages').lastElementChild.remove();
    renderRadar(data);
  } catch (e) {
    document.getElementById('messages').lastElementChild.remove();
    addSystemCard(`<div class="result-card card-green"><div class="card-header">🔭 RADAR</div><div class="card-body" style="color:var(--red)">${escHtml(e.message)}</div></div>`);
  } finally { setLoading(false, 'btn-radar'); }
}

function renderRadar(data) {
  const opps = data.opportunities || [];
  const items = opps.map(o => `
    <div class="opp-item">
      <div class="opp-title">${escHtml(o.title)}</div>
      <div>${escHtml(o.description)}</div>
      ${o.action ? `<div class="opp-action">→ ${escHtml(o.action)}</div>` : ''}
      <div class="opp-score">Score: ${o.score}/10 · Janela: ${escHtml(o.window||'')}</div>
    </div>`).join('');
  addSystemCard(`<div class="result-card card-green">
    <div class="card-header">🔭 RADAR DE OPORTUNIDADES${data.terms ? `<span style="color:var(--dim);font-weight:400"> — ${data.terms.join(', ')}</span>` : ''}</div>
    <div class="card-body">${opps.length ? `<div class="grid-3">${items}</div>` : '<span style="color:var(--dim)">Nenhuma oportunidade encontrada.</span>'}</div>
  </div>`);
}

function promptTopic(action) {
  topicAction = action;
  document.getElementById('topic-title').textContent = action === 'simulate' ? '📊 O que deseja simular?' : '🧠 Qual o tema para o conselho?';
  document.getElementById('topic-input').value = '';
  document.getElementById('modal-topic').classList.remove('hidden');
  setTimeout(() => document.getElementById('topic-input').focus(), 50);
}
function closeTopic() { document.getElementById('modal-topic').classList.add('hidden'); topicAction = null; }
function confirmTopic() {
  const topic = document.getElementById('topic-input').value.trim();
  if (!topic) return;
  closeTopic();
  if (topicAction === 'simulate') runSimulate(topic);
  else if (topicAction === 'council') runCouncil(topic);
}
document.getElementById('topic-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmTopic();
  if (e.key === 'Escape') closeTopic();
});

async function runSimulate(topic) {
  setLoading(true, 'btn-simulate');
  addSystemCard(`<div class="result-card card-blue"><div class="card-header">📊 SIMULAÇÃO: ${escHtml(topic)} — 3 analistas em paralelo...</div><div class="card-body"><div class="typing"><span></span><span></span><span></span></div></div></div>`);
  try {
    const res = await fetch(`${BASE}/api/simulate`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ topic }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    document.getElementById('messages').lastElementChild.remove();
    renderSimulation(data);
  } catch (e) {
    document.getElementById('messages').lastElementChild.remove();
    addSystemCard(`<div class="result-card card-blue"><div class="card-header">📊 SIMULAÇÃO</div><div class="card-body" style="color:var(--red)">${escHtml(e.message)}</div></div>`);
  } finally { setLoading(false, 'btn-simulate'); }
}

function renderSimulation(data) {
  const ICONS = { CUSTO:'💰', RISCO:'⚠', RETORNO:'📈' };
  const blocks = (data.analysts || []).map(a => `
    <div class="result-card card-${a.color}">
      <div class="card-header">${ICONS[a.name]||'•'} ${escHtml(a.name)}</div>
      <div class="card-body" style="white-space:pre-wrap">${escHtml(a.text)}</div>
    </div>`).join('');
  addSystemCard(`<div style="width:100%">
    <div class="result-card card-blue" style="margin-bottom:10px"><div class="card-header">📊 SIMULAÇÃO: ${escHtml(data.topic)}</div></div>
    <div class="grid-3">${blocks}</div>
    ${data.causal_inversion ? `<div class="causal-box"><div class="causal-label">🔄 CAUSALIDADE INVERTIDA — 3 condições para tornar este futuro inevitável</div><div style="white-space:pre-wrap">${escHtml(data.causal_inversion)}</div></div>` : ''}
  </div>`);
}

function renderCouncil(data) {
  const ICONS = { ESTRATEGISTA:'⚡', CIENTISTA:'🔬', INVESTIDOR:'💼', FILÓSOFO:'🌀', ADVERSÁRIO:'🗡', HACKER:'⚙' };
  const COLOR_CSS = { blue:'var(--blue)', cyan:'var(--cyan)', green:'var(--green)', magenta:'var(--magenta)', red:'var(--red)', yellow:'var(--yellow)' };
  const cards = (data.specialists || []).map(s => `
    <div class="specialist-item">
      <div class="specialist-name" style="color:${COLOR_CSS[s.color]||'var(--white)'}">
        ${ICONS[s.name]||'•'} ${escHtml(s.name)}
      </div>
      <div style="white-space:pre-wrap;font-size:13px">${escHtml(s.text)}</div>
    </div>`).join('');
  addSystemCard(`<div style="width:100%">
    <div class="result-card card-magenta" style="margin-bottom:10px"><div class="card-header">🧠 CONSELHO ESTRATÉGICO: ${escHtml(data.topic)}</div></div>
    <div class="grid-6">${cards}</div>
    <div class="synthesis-box"><div class="synth-label">⚡ SÍNTESE DO CONSELHO</div><div style="white-space:pre-wrap">${escHtml(data.synthesis)}</div></div>
  </div>`);
}

async function loadHistory() {
  setLoading(true, 'btn-history');
  try {
    const data = await (await fetch(`${BASE}/api/history?limit=20`)).json();
    const msgs = data.messages || [];
    if (!msgs.length) {
      addSystemCard(`<div class="result-card card-white"><div class="card-header">📜 HISTÓRICO</div><div class="card-body" style="color:var(--dim)">Nenhuma memória ainda.</div></div>`);
      return;
    }
    const rows = msgs.map(m => {
      const ts = m.timestamp?.slice(0,16).replace('T',' ') || '';
      const role = m.role === 'user' ? 'Você' : (profile.ghost_name || 'Ghost');
      const color = m.role === 'user' ? 'var(--cyan)' : 'var(--white)';
      const emotionTag = m.emotion && m.emotion !== 'neutro'
        ? `<span class="emotion-tag emotion-${m.emotion}">${m.emotion}</span>` : '';
      return `<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:10px">
        <span style="color:var(--dim);font-size:11px;flex-shrink:0;padding-top:1px">${ts}</span>
        <span><strong style="color:${color}">${escHtml(role)}</strong>${emotionTag}  ${escHtml(m.content.slice(0,120))}${m.content.length>120?'…':''}</span>
      </div>`;
    }).join('');
    addSystemCard(`<div class="result-card card-white"><div class="card-header">📜 ÚLTIMAS ${msgs.length} MENSAGENS</div><div class="card-body">${rows}</div></div>`);
  } finally { setLoading(false, 'btn-history'); }
}

function openProfile() {
  const FIELDS = ['ghost_name','user_name','main_goal','projects','skills','biggest_fear','past_failures','future_self','market','location'];
  FIELDS.forEach(k => { const el = document.getElementById(`pf-${k}`); if (el) el.value = profile[k] || ''; });
  document.getElementById('modal-profile').classList.remove('hidden');
}
function closeProfile() { document.getElementById('modal-profile').classList.add('hidden'); }
async function saveProfile() {
  const FIELDS = ['ghost_name','user_name','main_goal','projects','skills','biggest_fear','past_failures','future_self','market','location'];
  for (const k of FIELDS) {
    const el = document.getElementById(`pf-${k}`);
    if (el && el.value.trim()) {
      await fetch(`${BASE}/api/profile`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ key: k, value: el.value.trim() }),
      });
      profile[k] = el.value.trim();
    }
  }
  closeProfile();
}

document.getElementById('modal-profile').addEventListener('click', e => { if (e.target.id === 'modal-profile') closeProfile(); });
document.getElementById('modal-topic').addEventListener('click',   e => { if (e.target.id === 'modal-topic')   closeTopic(); });

function setLoading(on, btnId) {
  document.getElementById('send').disabled = on;
  document.getElementById('input').disabled = on;
  if (btnId) document.getElementById(btnId).disabled = on;
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

init();
